openapi: 3.0.3
info:
  title: Eden Boutique – API de gestion de stock
  version: 1.0.0
  description: 'API de la boutique de vêtements et articles pour enfants (0–15 ans).
    Authentification : `POST /api/auth/login/` puis en-tête `Authorization: Bearer
    <access>`. Voir docs/API.md pour le guide complet.'
paths:
  /api/age-ranges/:
    get:
      operationId: age_ranges_list
      description: Référentiel lisible par tous, modifiable par l'administrateur,
        tracé dans l'audit.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      tags:
      - Catalogue – référentiels
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgeRange'
          description: ''
    post:
      operationId: age_ranges_create
      description: Référentiel lisible par tous, modifiable par l'administrateur,
        tracé dans l'audit.
      tags:
      - Catalogue – référentiels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgeRangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgeRangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgeRangeRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeRange'
          description: ''
  /api/age-ranges/{id}/:
    get:
      operationId: age_ranges_retrieve
      description: Référentiel lisible par tous, modifiable par l'administrateur,
        tracé dans l'audit.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) tranche d'âge.
        required: true
      tags:
      - Catalogue – référentiels
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeRange'
          description: ''
    put:
      operationId: age_ranges_update
      description: Référentiel lisible par tous, modifiable par l'administrateur,
        tracé dans l'audit.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) tranche d'âge.
        required: true
      tags:
      - Catalogue – référentiels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgeRangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgeRangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgeRangeRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeRange'
          description: ''
    patch:
      operationId: age_ranges_partial_update
      description: Référentiel lisible par tous, modifiable par l'administrateur,
        tracé dans l'audit.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) tranche d'âge.
        required: true
      tags:
      - Catalogue – référentiels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAgeRangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAgeRangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAgeRangeRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeRange'
          description: ''
    delete:
      operationId: age_ranges_destroy
      description: Référentiel lisible par tous, modifiable par l'administrateur,
        tracé dans l'audit.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) tranche d'âge.
        required: true
      tags:
      - Catalogue – référentiels
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/articles/:
    get:
      operationId: articles_list
      description: Les articles archivés sont exclus sauf si `is_archived=true`.
      summary: Liste des articles (filtres, recherche, tri)
      parameters:
      - in: query
        name: age_months
        schema:
          type: number
        description: Articles adaptés à un enfant de N mois (ex. 30 = 2 ans et demi).
      - in: query
        name: age_range
        schema:
          type: integer
      - in: query
        name: article_type
        schema:
          type: array
          items:
            type: string
            title: Type d'article
            enum:
            - ACCESSORY
            - CHILDCARE
            - CLOTHING
            - FEEDING
            - HYGIENE
            - SAFETY
            - SHOES
            - TOY
            - UNDERWEAR
        description: |-
          * `CLOTHING` - Vêtement
          * `UNDERWEAR` - Sous-vêtement
          * `SHOES` - Chaussures
          * `ACCESSORY` - Accessoire
          * `CHILDCARE` - Puériculture et sommeil
          * `FEEDING` - Repas et alimentation
          * `HYGIENE` - Hygiène et soins
          * `SAFETY` - Sorties et sécurité
          * `TOY` - Jouet et éveil
        explode: true
        style: form
      - in: query
        name: brand
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: gender
        schema:
          type: array
          items:
            type: string
            title: Genre
            enum:
            - BOY
            - GIRL
            - UNISEX
        description: |-
          * `GIRL` - Fille
          * `BOY` - Garçon
          * `UNISEX` - Mixte
        explode: true
        style: form
      - in: query
        name: is_archived
        schema:
          type: boolean
      - in: query
        name: is_regulated
        schema:
          type: boolean
      - in: query
        name: max_price
        schema:
          type: number
      - in: query
        name: min_price
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: stock_status
        schema:
          type: string
          enum:
          - AVAILABLE
          - LOW
          - OK
          - OUT
        description: |-
          * `OUT` - Rupture
          * `LOW` - Stock faible
          * `OK` - Disponible
          * `AVAILABLE` - En stock (faible ou non)
      - in: query
        name: supplier
        schema:
          type: integer
      tags:
      - Catalogue – articles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleList'
          description: ''
    post:
      operationId: articles_create
      description: |-
        À ajouter aux ViewSets d'administration : chaque création, modification
        et suppression est automatiquement inscrite au journal d'audit.
      summary: Créer un article (avec ses variantes et son stock initial)
      tags:
      - Catalogue – articles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
          description: ''
  /api/articles/{id}/:
    get:
      operationId: articles_retrieve
      description: |-
        À ajouter aux ViewSets d'administration : chaque création, modification
        et suppression est automatiquement inscrite au journal d'audit.
      summary: Fiche article
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) article.
        required: true
      tags:
      - Catalogue – articles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
          description: ''
    put:
      operationId: articles_update
      description: |-
        À ajouter aux ViewSets d'administration : chaque création, modification
        et suppression est automatiquement inscrite au journal d'audit.
      summary: Modifier un article
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) article.
        required: true
      tags:
      - Catalogue – articles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
          description: ''
    patch:
      operationId: articles_partial_update
      description: |-
        À ajouter aux ViewSets d'administration : chaque création, modification
        et suppression est automatiquement inscrite au journal d'audit.
      summary: Modifier partiellement un article
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) article.
        required: true
      tags:
      - Catalogue – articles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArticleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArticleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArticleRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
          description: ''
    delete:
      operationId: articles_destroy
      description: |-
        À ajouter aux ViewSets d'administration : chaque création, modification
        et suppression est automatiquement inscrite au journal d'audit.
      summary: 'Supprimer un article jamais vendu ni mouvementé (sinon : archiver)'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) article.
        required: true
      tags:
      - Catalogue – articles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/articles/{id}/archive/:
    post:
      operationId: articles_archive_create
      description: |-
        À ajouter aux ViewSets d'administration : chaque création, modification
        et suppression est automatiquement inscrite au journal d'audit.
      summary: Archiver un article (il n'apparaît plus à la vente)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) article.
        required: true
      tags:
      - Catalogue – articles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
          description: ''
  /api/articles/{id}/restore/:
    post:
      operationId: articles_restore_create
      description: |-
        À ajouter aux ViewSets d'administration : chaque création, modification
        et suppression est automatiquement inscrite au journal d'audit.
      summary: Désarchiver un article
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) article.
        required: true
      tags:
      - Catalogue – articles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
          description: ''
  /api/articles/import/:
    post:
      operationId: articles_import_create
      description: 'Fichier `.xlsx` ou `.csv` (séparateur `;` ou `,`), une ligne par
        variante. Modèle : `GET /api/articles/import-template/`. Ajouter `dry_run=true`
        pour vérifier le fichier sans rien enregistrer. Tout ou rien : en cas d''erreur,
        aucune ligne n''est enregistrée.'
      summary: Importer des articles et du stock depuis un fichier Excel ou CSV
      tags:
      - Catalogue – articles
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
          description: ''
  /api/articles/import-template/:
    get:
      operationId: articles_import_template_retrieve
      description: |-
        À ajouter aux ViewSets d'administration : chaque création, modification
        et suppression est automatiquement inscrite au journal d'audit.
      summary: Télécharger le modèle de fichier d'import (CSV)
      tags:
      - Catalogue – articles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /api/audit-logs/:
    get:
      operationId: audit_logs_list
      summary: Journal d'audit (admin)
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - ARCHIVE
          - CASH_REPORT
          - CREATE
          - DELETE
          - LOGIN
          - LOGIN_FAILED
          - LOGOUT
          - PASSWORD_CHANGED
          - PASSWORD_RESET
          - RESTORE
          - SALE_CANCELLED
          - SALE_CREATED
          - STOCK_IMPORT
          - STOCK_MOVEMENT
          - UPDATE
        description: |-
          * `LOGIN` - Connexion
          * `LOGIN_FAILED` - Échec de connexion
          * `LOGOUT` - Déconnexion
          * `PASSWORD_CHANGED` - Mot de passe modifié
          * `PASSWORD_RESET` - Mot de passe réinitialisé par l'admin
          * `CREATE` - Création
          * `UPDATE` - Modification
          * `DELETE` - Suppression
          * `ARCHIVE` - Archivage
          * `RESTORE` - Restauration
          * `STOCK_MOVEMENT` - Mouvement de stock
          * `STOCK_IMPORT` - Import de fichier
          * `SALE_CREATED` - Vente enregistrée
          * `SALE_CANCELLED` - Vente annulée
          * `CASH_REPORT` - Compte rendu de caisse
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - Audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/audit-logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      summary: Détail d'une entrée du journal
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) entrée du
          journal d'audit.
        required: true
      tags:
      - Audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Déconnecte les autres appareils et renvoie de nouveaux tokens.
      summary: Changer son mot de passe
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Connexion par identifiant + mot de passe. Limité à 10 tentatives
        par minute.
      summary: Se connecter
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Se déconnecter
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Déconnecté
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Profil et droits de l'utilisateur connecté
      tags:
      - Authentification
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      summary: Renouveler le token d'accès
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/cash-reports/:
    get:
      operationId: cash_reports_list
      summary: Comptes rendus de caisse (les siens pour un caissier, tous pour l'admin)
      parameters:
      - in: query
        name: cashier
        schema:
          type: integer
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: report_date
        schema:
          type: string
          format: date
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: Statut
          enum:
          - REVIEWED
          - SUBMITTED
        description: |-
          * `SUBMITTED` - Envoyé
          * `REVIEWED` - Vérifié par l'administrateur
      tags:
      - Comptes rendus de caisse
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashReportList'
          description: ''
    post:
      operationId: cash_reports_create
      description: Le caissier saisit l'argent compté et un commentaire ; les totaux
        sont calculés par le serveur.
      summary: Envoyer le compte rendu de caisse de la journée
      tags:
      - Comptes rendus de caisse
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashReportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CashReportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CashReportRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashReport'
          description: ''
  /api/cash-reports/{id}/:
    get:
      operationId: cash_reports_retrieve
      summary: Détail d'un compte rendu
      parameters:
      - in: path
        name: id
