            type: string
            title: Type d'article
            enum:
            - ACCESSORY
            - CHILDCARE
            - CLOTHING
            - FEEDING
            - HYGIENE
            - SAFETY
            - SHOES
            - TOY
            - UNDERWEAR
        description: |-
          * `CLOTHING` - Vêtement
          * `UNDERWEAR` - Sous-vêtement
          * `SHOES` - Chaussures
          * `ACCESSORY` - Accessoire
          * `CHILDCARE` - Puériculture et sommeil
          * `FEEDING` - Repas et alimentation
          * `HYGIENE` - Hygiène et soins
          * `SAFETY` - Sorties et sécurité
          * `TOY` - Jouet et éveil
        explode: true
        style: form
      - in: query
        name: barcode
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: number
      - in: query
        name: color
        schema:
          type: integer
      - in: query
        name: gender
        schema:
          type: array
          items:
            type: string
            title: Genre
            enum:
            - BOY
            - GIRL
            - UNISEX
        description: |-
          * `GIRL` - Fille
          * `BOY` - Garçon
          * `UNISEX` - Mixte
        explode: true
        style: form
      - in: query
        name: include_archived
        schema:
          type: boolean
        description: Inclure les variantes d'articles archivés.
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: size
        schema:
          type: integer
