components:
  schemas:
    ActionEnum:
      enum:
      - LOGIN
      - LOGIN_FAILED
      - LOGOUT
      - PASSWORD_CHANGED
      - PASSWORD_RESET
      - CREATE
      - UPDATE
      - DELETE
      - ARCHIVE
      - RESTORE
      - STOCK_MOVEMENT
      - STOCK_IMPORT
      - SALE_CREATED
      - SALE_CANCELLED
      - CASH_REPORT
      type: string
      description: |-
        * `LOGIN` - Connexion
        * `LOGIN_FAILED` - Échec de connexion
        * `LOGOUT` - Déconnexion
        * `PASSWORD_CHANGED` - Mot de passe modifié
        * `PASSWORD_RESET` - Mot de passe réinitialisé par l'admin
        * `CREATE` - Création
        * `UPDATE` - Modification
        * `DELETE` - Suppression
        * `ARCHIVE` - Archivage
        * `RESTORE` - Restauration
        * `STOCK_MOVEMENT` - Mouvement de stock
        * `STOCK_IMPORT` - Import de fichier
        * `SALE_CREATED` - Vente enregistrée
        * `SALE_CANCELLED` - Vente annulée
        * `CASH_REPORT` - Compte rendu de caisse
    AdminUser:
      type: object
      description: Gestion des comptes par l'administrateur.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
          pattern: ^[\w.@+-]+$
          maxLength: 150
        full_name:
          type: string
          title: Nom complet
          maxLength: 150
        phone:
          type: string
          title: Téléphone
          maxLength: 30
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          title: Rôle
        role_label:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
        must_change_password:
          type: boolean
          readOnly: true
          title: Doit changer son mot de passe
          description: Activé quand l'administrateur crée le compte ou réinitialise
            le mot de passe.
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Dernière connexion
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Date d’inscription
      required:
      - date_joined
      - full_name
      - id
      - is_active
      - last_login
      - must_change_password
      - role_label
      - username
    AdminUserRequest:
      type: object
      description: Gestion des comptes par l'administrateur.
      properties:
        username:
          type: string
          minLength: 1
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
          pattern: ^[\w.@+-]+$
          maxLength: 150
        full_name:
          type: string
          minLength: 1
          title: Nom complet
          maxLength: 150
        phone:
          type: string
          title: Téléphone
          maxLength: 30
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          title: Rôle
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: Obligatoire à la création. L'utilisateur devra le changer à
            sa première connexion.
      required:
      - full_name
      - username
    AgeRange:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          title: Libellé
          maxLength: 50
        min_months:
          type: integer
          maximum: 32767
          minimum: 0
          title: Âge minimum (mois)
        max_months:
          type: integer
          maximum: 32767
          minimum: 0
          title: Âge maximum (mois)
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
          title: Ordre d'affichage
        is_active:
          type: boolean
          title: Active
      required:
      - id
      - label
      - max_months
      - min_months
    AgeRangeRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          title: Libellé
          maxLength: 50
        min_months:
          type: integer
          maximum: 32767
          minimum: 0
          title: Âge minimum (mois)
        max_months:
          type: integer
          maximum: 32767
          minimum: 0
          title: Âge maximum (mois)
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
          title: Ordre d'affichage
        is_active:
          type: boolean
          title: Active
      required:
      - label
      - max_months
      - min_months
    Article:
      type: object
      description: Retire de la réponse les champs listés dans `admin_only_fields`
        pour les caissiers.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nom
          maxLength: 150
        reference:
          type: string
          title: Référence
          maxLength: 50
        category:
          type: integer
          title: Catégorie
        category_name:
          type: string
          readOnly: true
        article_type:
          allOf:
          - $ref: '#/components/schemas/ArticleTypeEnum'
          title: Type d'article
        article_type_label:
          type: string
          readOnly: true
        gender:
          allOf:
          - $ref: '#/components/schemas/GenderEnum'
          title: Genre
        gender_label:
          type: string
          readOnly: true
        age_ranges:
          type: array
          items:
            type: integer
            title: Tranches d'âge
          title: Tranches d'âge
        age_range_labels:
          type: array
          items:
            type: string
            title: Libellé
          readOnly: true
        brand:
          type: string
          title: Marque
          maxLength: 100
        supplier:
          type: integer
          nullable: true
          title: Fournisseur
        supplier_name:
          type: string
          readOnly: true
        description:
          type: string
        material:
          type: string
          title: Matière
          maxLength: 150
        care_instructions:
          type: string
          title: Entretien
          maxLength: 255
        image:
          type: string
          format: uri
          nullable: true
        purchase_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
