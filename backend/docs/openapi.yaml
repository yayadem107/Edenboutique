          - OK
          - OUT
        description: |-
          * `OUT` - Rupture
          * `LOW` - Stock faible
          * `OK` - Disponible
          * `AVAILABLE` - En stock (faible ou non)
      tags:
      - Catalogue – articles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
