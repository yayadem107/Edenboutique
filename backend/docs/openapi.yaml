      - ADJUST_OUT
      - LOSS
      - SUPPLIER_RETURN
      type: string
      description: |-
        * `PURCHASE` - Entrée – réception fournisseur
        * `CUSTOMER_RETURN` - Entrée – retour client
        * `ADJUST_IN` - Entrée – ajustement d'inventaire
        * `ADJUST_OUT` - Sortie – ajustement d'inventaire
        * `LOSS` - Sortie – perte, casse ou vol
        * `SUPPLIER_RETURN` - Sortie – retour fournisseur
    StockMovementCreateRequest:
      type: object
      properties:
        variant:
          type: integer
        movement_type:
          allOf:
          - $ref: '#/components/schemas/StockMovementCreateMovementTypeEnum'
          description: |-
            Les ventes et annulations génèrent leurs mouvements automatiquement.

            * `PURCHASE` - Entrée – réception fournisseur
            * `CUSTOMER_RETURN` - Entrée – retour client
            * `ADJUST_IN` - Entrée – ajustement d'inventaire
            * `ADJUST_OUT` - Sortie – ajustement d'inventaire
            * `LOSS` - Sortie – perte, casse ou vol
            * `SUPPLIER_RETURN` - Sortie – retour fournisseur
        quantity:
          type: integer
          minimum: 1
        reason:
          type: string
          default: ''
          maxLength: 255
        lot_number:
          type: string
          default: ''
          maxLength: 64
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
      required:
      - movement_type
      - quantity
      - variant
